<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>泛舟游客的博客</title>
    <link rel="icon" href="/favicon.jpg" type="image/jpeg">
    <link rel="stylesheet" href="/res/css/index.css">
    <script type="module" src="/res/js/index.js"></script>

    <!-- nav,footer -->
    <link rel="stylesheet" href="/view/tags/nav.css">
    <link rel="stylesheet" href="/view/tags/footer.css">  
    <script  src="/view/tags/nav.js" defer></script>
    <script src="/view/tags/footer.js"></script>

    <!-- 字体扩展 -->
    <link rel="stylesheet" href="/res/css/extend.css">
    <script src="/res/js/extend/font_trigger.js" defer></script>

</head>

<body>
    <div class="navigation"></div>
    
    <div class="top-section">
        <div class="top-background">
            <span class="top-sign-0">给时光以生命，给岁月以文明</span>
            <span class="top-sign-1">-- 《三体》</span>
        </div>
    </div>
    <div class="main-content">

        <div class="content-container">
            <div class="sidebar">
                <div class="sidebar-sign">
                    <div class="sidebar-logo"><img src="/favicon.jpg" loading="lazy" alt="logo"></div>
                    <div class="sidebar-name">泛舟游客</div>
                    <div class="sidebar-sign">江心泛泛虚影，名曰泛舟游客</div>
                    <div class="sidebar-social">
                        <a href="mailto:boatdrift@qq.com">
                            <img src="/res/media/svg/logo/email.svg" loading="lazy" alt="email">
                        </a>
                        <a href="https://github.com/gravitysword">
                            <img src="/res/media/svg/logo/github.svg" loading="lazy" alt="github">
                        </a>
                        <a href="https://space.bilibili.com/0">
                            <img src="/res/media/svg/logo/bili.svg" loading="lazy" alt="bilibili">
                        </a>
                    </div>
                </div>

                <div class="sidebar-introduce">
                    <h3>个人介绍</h3>
                    <p>西南某普通一本的在读大学生</p>

                </div>

                <div class="sidebar-notice">
                    <h3>网站公告</h3>
                    <p>无</p>
                </div>
            </div>

            <div class="blog-list">
                <!-- 博客列表与分页由 index.js 动态渲染 -->
                <ul></ul>
                <div class="pagination"></div>
            </div>
        </div>
    </div>
    <!-- 引入共享的页脚模板 -->
    <div id="footer"></div>
</body>

</html>
